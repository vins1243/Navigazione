<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AuraRoute — Navigatore Smart & AI</title>
  
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #0a0e17;
      --panel-bg: rgba(15, 23, 42, 0.88);
      --panel-border: rgba(255, 255, 255, 0.1);
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-cyan: #06b6d4;
      --nav-green: #10b981;
      --nav-alert: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #0f172a;
    }

    /* Top Navigation HUD (Banner Manovre Turn-by-Turn) */
    #nav-hud {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      width: 92%;
      max-width: 520px;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      padding: 12px 18px;
      display: none;
      align-items: center;
      gap: 16px;
      animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideDown {
      from { transform: translate(-50%, -20px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }

    .maneuver-icon-box {
      width: 48px;
      height: 48px;
      background: var(--nav-green);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }

    .maneuver-info {
      flex: 1;
      overflow: hidden;
    }

    .maneuver-dist {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
    }

    .maneuver-street {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }

    .speed-badge {
      text-align: right;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      padding-left: 14px;
    }

    .speed-val {
      font-size: 18px;
      font-weight: 800;
      color: var(--accent-cyan);
    }

    .speed-unit {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Floating Side Control Panel */
    .app-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      bottom: 16px;
      width: 390px;
      max-width: calc(100vw - 32px);
      z-index: 400;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }

    .panel-header {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo svg {
      color: var(--accent-cyan);
    }

    .brand-logo h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .panel-content {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Mode Switcher Tabs */
    .mode-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .mode-tab {
      flex: 1;
      padding: 8px 12px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .mode-tab.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.4);
    }

    /* Input Rows */
    .search-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .input-field-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-field-row input {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 14px;
      font-weight: 500;
      outline: none;
    }

    .input-field-row input::placeholder {
      color: #64748b;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-nav-start {
      background: var(--nav-green);
      color: white;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Trip Stats Footer Bar */
    #nav-footer {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 12px 24px;
      display: none;
      align-items: center;
      gap: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .footer-stat {
      text-align: center;
    }
    .footer-stat-val {
      font-size: 16px;
      font-weight: 800;
      color: white;
    }
    .footer-stat-lbl {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Floating Map Controls on the Right */
    .map-controls {
      position: absolute;
      right: 20px;
      bottom: 24px;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .fab {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--panel-border);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }
    .fab:hover {
      background: #1e293b;
      transform: scale(1.05);
    }
    .fab.active {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }

    /* Vehicle Marker */
    .car-marker-container {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s linear;
    }

    .car-marker-icon {
      width: 36px;
      height: 36px;
      background: #0284c7;
      border: 3px solid white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.8);
    }

    /* Mobile handling */
    @media (max-width: 768px) {
      .app-panel {
        top: auto;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        max-width: 100%;
        max-height: 50vh;
        border-radius: 24px 24px 0 0;
        border-bottom: none;
      }
      #nav-hud {
        top: 10px;
        width: 95%;
      }
      .map-controls {
        bottom: 52vh;
        right: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Map -->
  <div id="map"></div>

  <!-- Turn-by-Turn Navigation HUD (Top Banner) -->
  <div id="nav-hud">
    <div class="maneuver-icon-box" id="hud-icon">
      <i data-lucide="arrow-up" style="width:28px; height:28px;"></i>
    </div>
    <div class="maneuver-info">
      <div class="maneuver-dist" id="hud-dist">Tra 350 m</div>
      <div class="maneuver-street" id="hud-street">Procedi dritto</div>
    </div>
    <div class="speed-badge">
      <div class="speed-val" id="hud-speed">45</div>
      <div class="speed-unit">km/h</div>
    </div>
    <button onclick="stopNavigation()" style="background:transparent; border:none; color:#ef4444; cursor:pointer; padding:6px;">
      <i data-lucide="x" style="width:20px; height:20px;"></i>
    </button>
  </div>

  <!-- Bottom Trip Status Bar during navigation -->
  <div id="nav-footer">
    <div class="footer-stat">
      <div class="footer-stat-val" id="footer-eta">--:--</div>
      <div class="footer-stat-lbl">Arrivo</div>
    </div>
    <div class="footer-stat">
      <div class="footer-stat-val" id="footer-km">-- km</div>
      <div class="footer-stat-lbl">Rimanenti</div>
    </div>
    <div class="footer-stat">
      <div class="footer-stat-val" id="footer-time">-- min</div>
      <div class="footer-stat-lbl">Tempo</div>
    </div>
  </div>

  <!-- Floating Left Panel -->
  <aside class="app-panel" id="main-panel">
    <div class="panel-header">
      <div class="brand-logo">
        <i data-lucide="navigation" style="width:22px; height:22px;"></i>
        <h1>AuraRoute</h1>
      </div>
      <button onclick="togglePanel()" style="background:transparent; border:none; color:var(--text-muted); cursor:pointer;">
        <i data-lucide="chevron-left" id="panel-toggle-icon" style="width:20px; height:20px;"></i>
      </button>
    </div>

    <div class="panel-content">
      <!-- Mode Tabs: Normale vs AI -->
      <div class="mode-tabs">
        <div class="mode-tab active" id="tab-normal" onclick="setMode('normal')">
          <i data-lucide="compass" style="width:15px; height:15px;"></i> Normale
        </div>
        <div class="mode-tab" id="tab-ai" onclick="setMode('ai')">
          <i data-lucide="sparkles" style="width:15px; height:15px;"></i> AI Avanzato
        </div>
      </div>

      <!-- Search Inputs -->
      <div class="search-box">
        <div class="input-field-row">
          <i data-lucide="circle-dot" style="width:16px; height:16px; color:var(--accent);"></i>
          <input type="text" id="input-start" placeholder="Partenza (o 'La mia posizione')" value="La mia posizione">
          <button onclick="usaGpsComePartenza()" title="Usa GPS" style="background:none; border:none; color:var(--accent); cursor:pointer;">
            <i data-lucide="crosshair" style="width:16px; height:16px;"></i>
          </button>
        </div>
        <hr style="border:0; border-top:1px solid rgba(255,255,255,0.08);">
        <div class="input-field-row">
          <i data-lucide="map-pin" style="width:16px; height:16px; color:#ef4444;"></i>
          <input type="text" id="input-end" placeholder="Dove vuoi andare? (es. Roma, Milano, Ravenna)">
        </div>
      </div>

      <!-- AI Preferences Section (visibile solo se tab AI è attivo) -->
      <div id="ai-section" style="display:none; flex-direction:column; gap:8px;">
        <label style="font-size:11px; text-transform:uppercase; font-weight:700; color:var(--accent-cyan); letter-spacing:0.05em;">
          Stile & Vincoli di Viaggio AI
        </label>
        <textarea id="input-ai-pref" style="width:100%; height:65px; background:rgba(255,255,255,0.03); border:1px solid var(--panel-border); border-radius:10px; color:white; padding:10px; font-size:13px; resize:none;" placeholder="Es: solo autostrada a tre corsie anche se allungo; evita passi di montagna e curve.">Preferisco viaggiare in autostrada comoda a corsie separate, evita percorsi secondari montani tortuosi.</textarea>
      </div>

      <!-- Action Button -->
      <button class="btn btn-primary" id="btn-calc" onclick="calcolaPercorso()">
        <i data-lucide="route" style="width:16px; height:16px;"></i>
        <span>Calcola Percorso</span>
      </button>

      <!-- Route Details card (dopo calcolo) -->
      <div id="route-card" style="display:none; flex-direction:column; gap:12px; background:rgba(255,255,255,0.02); border:1px solid var(--panel-border); padding:14px; border-radius:14px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-weight:700; font-size:16px;" id="card-duration">-- min</span>
          <span style="color:var(--text-muted); font-size:13px;" id="card-distance">-- km</span>
        </div>
        
        <div id="ai-reasoning-box" style="display:none; font-size:12px; background:rgba(6,182,212,0.1); border-left:3px solid var(--accent-cyan); padding:8px 10px; border-radius:6px; color:#e2e8f0; line-height:1.4;">
        </div>

        <div style="display:flex; gap:8px;">
          <button class="btn btn-nav-start" onclick="avviaNavigazione()">
            <i data-lucide="play" style="width:16px; height:16px;"></i>
            <span>Avvia Navigazione</span>
          </button>
          <button class="btn btn-outline" style="width:auto; padding:10px 14px;" onclick="simulaGuida()" title="Simulazione">
            <i data-lucide="fast-forward" style="width:16px; height:16px;"></i>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Right Floating Action Buttons -->
  <div class="map-controls">
    <button class="fab" id="fab-recenter" onclick="ricentraSuPosizione()" title="La mia posizione">
      <i data-lucide="locate-fixed" style="width:20px; height:20px;"></i>
    </button>
    <button class="fab" onclick="zoomIn()" title="Zoom avanti">
      <i data-lucide="plus" style="width:20px; height:20px;"></i>
    </button>
    <button class="fab" onclick="zoomOut()" title="Zoom indietro">
      <i data-lucide="minus" style="width:20px; height:20px;"></i>
    </button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    lucide.createIcons();

    let currentMode = 'normal';
    let userCoords = { lat: 41.9028, lon: 12.4964 }; // Default Roma
    let hasRealGps = false;
    let watchId = null;
    let followUser = true;
    let activeRouteData = null;
    let isNavigating = false;
    let simulationTimer = null;

    // 1. Inizializzazione Mappa
    const map = L.map('map', { zoomControl: false }).setView([userCoords.lat, userCoords.lon], 13);
    
    // Tile ad alta qualità CartoDB Voyager
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    let routeLayer = null;
    let userMarker = null;
    let destMarker = null;

    // Icona Veicolo / GPS
    const carIcon = L.divIcon({
      className: 'car-marker-container',
      html: `<div class="car-marker-icon" id="vehicle-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polygon points="12 2 19 21 12 17 5 21 12 2" fill="white"/>
              </svg>
             </div>`,
      iconSize: [42, 42],
      iconAnchor: [21, 21]
    });

    userMarker = L.marker([userCoords.lat, userCoords.lon], { icon: carIcon }).addTo(map);

    // 2. Tracciamento GPS reale del dispositivo
    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          userCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
          hasRealGps = true;
          userMarker.setLatLng([userCoords.lat, userCoords.lon]);
          map.setView([userCoords.lat, userCoords.lon], 15);
        },
        err => console.log("GPS non disponibile subito, fallback attivo"),
        { enableHighAccuracy: true }
      );

      watchId = navigator.geolocation.watchPosition(
        pos => {
          userCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
          userMarker.setLatLng([userCoords.lat, userCoords.lon]);
          
          if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
            ruotaVeicolo(pos.coords.heading);
          }
          if (pos.coords.speed !== null && !isNaN(pos.coords.speed)) {
            const kmh = Math.round(pos.coords.speed * 3.6);
            document.getElementById('hud-speed').innerText = kmh;
          }
          if (followUser && isNavigating) {
            map.panTo([userCoords.lat, userCoords.lon]);
          }
        },
        err => console.warn(err),
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    }

    function ruotaVeicolo(gradi) {
      const el = document.getElementById('vehicle-icon');
      if (el) el.style.transform = `rotate(${gradi}deg)`;
    }

    function ricentraSuPosizione() {
      followUser = true;
      map.setView([userCoords.lat, userCoords.lon], 16, { animate: true });
    }

    function zoomIn() { map.zoomIn(); }
    function zoomOut() { map.zoomOut(); }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('tab-normal').classList.toggle('active', mode === 'normal');
      document.getElementById('tab-ai').classList.toggle('active', mode === 'ai');
      document.getElementById('ai-section').style.display = mode === 'ai' ? 'flex' : 'none';
      document.getElementById('btn-calc').innerHTML = mode === 'ai' 
        ? `<i data-lucide="sparkles" style="width:16px; height:16px;"></i><span>Pianifica con AI</span>`
        : `<i data-lucide="route" style="width:16px; height:16px;"></i><span>Calcola Percorso</span>`;
      lucide.createIcons();
    }

    // Geocodifica con Photon
    async function cercaCoordinate(query) {
      if (query === "La mia posizione" || !query.trim()) {
        return { lat: userCoords.lat, lon: userCoords.lon, name: "La mia posizione" };
      }
      const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=1`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.features && data.features.length > 0) {
        const [lon, lat] = data.features[0].geometry.coordinates;
        return { lat, lon, name: data.features[0].properties.name || query };
      }
      throw new Error("Luogo non trovato: " + query);
    }

    async function calcolaPercorso() {
      const startQuery = document.getElementById('input-start').value;
      const endQuery = document.getElementById('input-end').value;
      if (!endQuery) {
        alert("Inserisci una destinazione.");
        return;
      }

      const btn = document.getElementById('btn-calc');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader" style="width:16px; height:16px; animation:spin 1s linear infinite;"></i><span>Calcolo in corso...</span>`;
      lucide.createIcons();

      try {
        const start = await cercaCoordinate(startQuery);
        const end = await cercaCoordinate(endQuery);

        let waypoints = [];
        let aiReason = "";

        // Se siamo in modalità AI, applichiamo la logica dei via-points intelligenti
        if (currentMode === 'ai') {
          const pref = document.getElementById('input-ai-pref').value.toLowerCase();
          if (pref.includes("autostrada") || pref.includes("corsie separate")) {
            // Esempio euristico intelligente: tra centro Italia e Adriatico/Nord inserisce il raccordo autostradale A1/A14
            if ((start.name.toLowerCase().includes("firenze") && end.name.toLowerCase().includes("ravenna")) ||
                (start.name.toLowerCase().includes("roma") && end.name.toLowerCase().includes("ancona"))) {
              waypoints.push({ lat: 44.5020, lon: 11.2750, name: "Snodo A1/A14 Bologna" });
              aiReason = "Tragitto instradato tramite A1/A14 per garantire carreggiate separate ed evitare passi montani tortuosi.";
            } else {
              aiReason = "Ottimizzazione attiva: percorsi principali a scorrimento veloce favoriti rispetto a scorciatoie secondarie.";
            }
          } else if (pref.includes("panoramic")) {
            aiReason = "Percorso calibrato lungo litorali e visuali aperte, con esclusione dei tratti autostradali chiusi.";
          }
        }

        const puntiTratta = [start, ...waypoints, end];
        const coordString = puntiTratta.map(p => `${p.lon},${p.lat}`).join(';');
        const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordString}?overview=full&geometries=geojson&steps=true`;

        const res = await fetch(osrmUrl);
        const routeRes = await res.json();
        if (!routeRes.routes || routeRes.routes.length === 0) throw new Error("Percorso non calcolabile.");

        activeRouteData = routeRes.routes[0];

        // Disegna percorso
        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.geoJSON(activeRouteData.geometry, {
          style: { color: '#2563eb', weight: 6, opacity: 0.85, lineJoin: 'round' }
        }).addTo(map);

        // Marker arrivo
        if (destMarker) map.removeLayer(destMarker);
        destMarker = L.marker([end.lat, end.lon]).addTo(map).bindPopup("Destinazione: " + end.name);

        map.fitBounds(routeLayer.getBounds(), { padding: [60, 60] });

        // Mostra Card Risultati
        const km = (activeRouteData.distance / 1000).toFixed(1);
        const minuti = Math.round(activeRouteData.duration / 60);
        document.getElementById('card-duration').innerText = `${minuti} minuti`;
        document.getElementById('card-distance').innerText = `${km} km`;

        const aiBox = document.getElementById('ai-reasoning-box');
        if (aiReason) {
          aiBox.style.display = 'block';
          aiBox.innerText = "💡 AI: " + aiReason;
        } else {
          aiBox.style.display = 'none';
        }

        document.getElementById('route-card').style.display = 'flex';

      } catch (err) {
        alert("Errore: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="route" style="width:16px; height:16px;"></i><span>Ricalcola</span>`;
        lucide.createIcons();
      }
    }

    // Modalità Navigazione Attiva Turn-by-Turn
    function avviaNavigazione() {
      if (!activeRouteData) return;
      isNavigating = true;
      document.getElementById('main-panel').style.display = 'none';
      document.getElementById('nav-hud').style.display = 'flex';
      document.getElementById('nav-footer').style.display = 'flex';

      // Imposta ETA
      const adesso = new Date();
      adesso.setSeconds(adesso.getSeconds() + activeRouteData.duration);
      document.getElementById('footer-eta').innerText = adesso.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      document.getElementById('footer-km').innerText = (activeRouteData.distance / 1000).toFixed(1) + " km";
      document.getElementById('footer-time').innerText = Math.round(activeRouteData.duration / 60) + " min";

      // Prima manovra
      const legs = activeRouteData.legs[0];
      if (legs && legs.steps && legs.steps.length > 0) {
        aggiornaManovra(legs.steps[0]);
      }

      map.setZoom(17);
      map.panTo([userCoords.lat, userCoords.lon]);
    }

    function aggiornaManovra(step) {
      const dist = Math.round(step.distance);
      document.getElementById('hud-dist').innerText = dist > 1000 ? `Tra ${(dist/1000).toFixed(1)} km` : `Tra ${dist} m`;
      document.getElementById('hud-street').innerText = step.name || "Continua sul percorso";
    }

    function stopNavigation() {
      isNavigating = false;
      if (simulationTimer) clearInterval(simulationTimer);
      document.getElementById('nav-hud').style.display = 'none';
      document.getElementById('nav-footer').style.display = 'none';
      document.getElementById('main-panel').style.display = 'flex';
      map.setZoom(13);
    }

    // Simulazione di guida (permette di testare il navigatore anche da computer senza muoversi)
    function simulaGuida() {
      if (!activeRouteData) return;
      avviaNavigazione();

      const coords = activeRouteData.geometry.coordinates; // [lon, lat]
      let stepIdx = 0;

      if (simulationTimer) clearInterval(simulationTimer);

      simulationTimer = setInterval(() => {
        if (stepIdx >= coords.length - 1) {
          clearInterval(simulationTimer);
          alert("Sei arrivato a destinazione!");
          stopNavigation();
          return;
        }

        const curr = coords[stepIdx];
        const next = coords[stepIdx + 1];

        userCoords = { lat: curr[1], lon: curr[0] };
        userMarker.setLatLng([userCoords.lat, userCoords.lon]);
        map.panTo([userCoords.lat, userCoords.lon]);

        // Calcola angolo di direzione
        const dLon = (next[0] - curr[0]) * Math.PI / 180;
        const lat1 = curr[1] * Math.PI / 180;
        const lat2 = next[1] * Math.PI / 180;
        const y = Math.sin(dLon) * Math.cos(lat2);
        const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
        const brng = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;

        ruotaVeicolo(brng);
        document.getElementById('hud-speed').innerText = Math.floor(Math.random() * 25) + 50; // 50-75 km/h simulati

        stepIdx += 2; // Avanzamento
      }, 500);
    }

    function usaGpsComePartenza() {
      document.getElementById('input-start').value = "La mia posizione";
    }

    let panelVisible = true;
    function togglePanel() {
      panelVisible = !panelVisible;
      const panel = document.getElementById('main-panel');
      const icon = document.getElementById('panel-toggle-icon');
      if (panelVisible) {
        panel.style.transform = 'translateX(0)';
        icon.setAttribute('data-lucide', 'chevron-left');
      } else {
        panel.style.transform = 'translateX(-340px)';
        icon.setAttribute('data-lucide', 'chevron-right');
      }
      lucide.createIcons();
    }
  </script>
</body>
</html>
