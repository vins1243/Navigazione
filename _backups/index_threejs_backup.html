<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- iOS PWA Standalone Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AuraRoute">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f141c">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
  <link rel="manifest" href="manifest.json">

  <title>AuraRoute — Navigatore Automotive 3D</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- MapLibre GL CSS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --easylink-dark: #0f141c;
      --easylink-blue: #0072ce;
      --easylink-cyan: #00b4d8;
      --easylink-green: #10b981;
      --easylink-card: rgba(15, 23, 36, 0.94);
      --easylink-border: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--easylink-dark);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background: #e2e8f0;
    }

    /* Top Navigation HUD (Renault Easy Link Style) */
    #nav-header-easylink {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      max-width: 580px;
      margin: 0 auto;
      z-index: 500;
      background: var(--easylink-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--easylink-border);
      border-radius: 18px;
      padding: 14px 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      display: none;
      flex-direction: column;
      gap: 10px;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .nav-main-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .maneuver-badge-box {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
    }

    .maneuver-content {
      flex: 1;
      overflow: hidden;
    }

    .maneuver-dist-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .maneuver-distance-val {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .maneuver-stage-tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(0, 180, 216, 0.2);
      color: var(--easylink-cyan);
      border: 1px solid rgba(0, 180, 216, 0.3);
    }

    .maneuver-street-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }

    /* Barra di avvicinamento progressivo */
    .approach-progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .approach-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #00b4d8);
      transition: width 0.2s linear;
    }

    /* Lane Guidance (Corsie) */
    #lane-guidance {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .lane-arrow {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      color: #64748b;
    }

    .lane-arrow.active {
      background: var(--easylink-green);
      color: white;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
    }

    /* Cartello Limite Velocità */
    #speed-limit-sign {
      position: absolute;
      top: max(100px, calc(env(safe-area-inset-top) + 80px));
      left: 18px;
      z-index: 450;
      width: 52px;
      height: 52px;
      background: #ffffff;
      border: 6px solid #ef4444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: 900;
      color: #111827;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      letter-spacing: -0.05em;
    }

    /* Pillola Strada Attuale (Bottom Center) */
    #current-street-pill {
      position: absolute;
      bottom: max(96px, calc(env(safe-area-inset-bottom) + 80px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 450;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid var(--easylink-border);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      max-width: 80vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Footer Info Viaggio */
    #nav-footer-easylink {
      position: absolute;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      background: var(--easylink-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--easylink-border);
      border-radius: 18px;
      padding: 12px 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      gap: 28px;
    }

    .footer-stat-box { text-align: center; }
    .footer-stat-val { font-size: 18px; font-weight: 800; color: white; }
    .footer-stat-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }

    /* Barra Ricerca */
    #search-panel {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      max-width: 480px;
      margin: 0 auto;
      z-index: 500;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-box {
      background: var(--easylink-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--easylink-border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 15px;
      font-weight: 600;
      outline: none;
    }
    .search-box input::placeholder { color: var(--text-muted); }

    #search-results {
      background: var(--easylink-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--easylink-border);
      border-radius: 14px;
      max-height: 240px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .result-item {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .result-item:hover { background: rgba(255, 255, 255, 0.08); }
    .result-title { font-weight: 700; color: white; font-size: 14px; }
    .result-sub { font-size: 12px; color: var(--text-muted); }

    /* Pulsanti Rapidi Mappa (Destra) */
    .map-controls-right {
      position: absolute;
      right: 18px;
      bottom: max(100px, calc(env(safe-area-inset-bottom) + 80px));
      z-index: 450;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-btn {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--easylink-card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--easylink-border);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
      transition: all 0.2s;
    }
    .control-btn:hover { background: rgba(255, 255, 255, 0.1); }

    
    /* ============================================================
       MODELLO 3D VOLUMETRICO HATCHBACK (Ispirato a Mégane IV - De-branded)
       Proporzioni ricavate dalla scheda tecnica: rapporto 2.4:1 (4.36m x 1.81m)
       ============================================================ */
    .vehicle-3d-model {
      position: relative;
      width: 50px;
      height: 70px;
      transform-style: preserve-3d;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 1. Fascio luminoso proiettato sull'asfalto davanti all'auto */
    .headlights-beam {
      position: absolute;
      top: -55px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 28px solid transparent;
      border-right: 28px solid transparent;
      border-top: 65px solid rgba(255, 255, 255, 0.22);
      filter: blur(5px);
      pointer-events: none;
      z-index: 1;
    }

    /* 2. Ombra volumetrica di contatto al suolo */
    .car-ground-shadow {
      position: absolute;
      width: 38px;
      height: 62px;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 14px;
      top: 6px;
      left: 6px;
      filter: blur(6px);
      z-index: 2;
    }

    /* 3. Corpo Vettura: sagoma hatchback sportiva */
    .car-chassis-hatchback {
      position: absolute;
      width: 30px;
      height: 60px;
      top: 5px;
      left: 10px;
      z-index: 10;
      transform-style: preserve-3d;
    }

    /* Scocca metallizzata Grigio Titanio con riflessi */
    .car-body-shell {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #94a3b8 0%, #64748b 25%, #475569 75%, #334155 100%);
      border-radius: 12px 12px 10px 10px;
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.6), 0 6px 16px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.35);
      overflow: hidden;
    }

    /* Nervature sul cofano motore */
    .hood-creases {
      position: absolute;
      top: 4px;
      left: 4px;
      right: 4px;
      height: 16px;
      display: flex;
      justify-content: space-between;
    }
    .hood-crease-line {
      width: 1.5px;
      height: 100%;
      background: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(0,0,0,0.2));
      border-radius: 1px;
    }

    /* Fari anteriori C-Shape a LED (Firma luminosa senza logo) */
    .front-lights-bar {
      position: absolute;
      top: 1px;
      left: 2px;
      right: 2px;
      height: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .headlight-led {
      width: 7px;
      height: 3px;
      background: #ffffff;
      border-radius: 2px;
      box-shadow: 0 0 10px #38bdf8, 0 0 4px #ffffff;
    }
    .front-grille-line {
      flex: 1;
      height: 1.5px;
      background: #1e293b;
      margin: 0 3px;
      border-radius: 1px;
    }

    /* Abitacolo (Greenhouse) con montanti e vetri scuri */
    .car-cabin {
      position: absolute;
      top: 17px;
      left: 3px;
      right: 3px;
      height: 32px;
      background: #0f172a;
      border-radius: 6px 6px 5px 5px;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Parabrezza anteriore aerodinamico inclinato */
    .cabin-windshield {
      width: 20px;
      height: 9px;
      background: linear-gradient(180deg, rgba(148, 163, 184, 0.4) 0%, rgba(15, 23, 42, 0.95) 100%);
      border-radius: 3px 3px 1px 1px;
      position: relative;
      margin-top: 1px;
    }
    .cabin-windshield::after {
      content: '';
      position: absolute;
      top: 1px;
      left: 3px;
      width: 4px;
      height: 7px;
      background: rgba(255, 255, 255, 0.55);
      transform: skewX(-25deg);
      border-radius: 1px;
    }

    /* Tettuccio panoramico */
    .cabin-roof {
      width: 18px;
      height: 12px;
      background: #1e293b;
      margin-top: 1px;
      border-radius: 1px;
      border-top: 1px solid rgba(255,255,255,0.15);
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }

    /* Lunotto posteriore inclinato hatchback */
    .cabin-rear-window {
      width: 19px;
      height: 7px;
      background: linear-gradient(180deg, #0f172a 0%, rgba(148, 163, 184, 0.3) 100%);
      border-radius: 1px 1px 3px 3px;
      margin-top: 1px;
    }

    /* Spoiler posteriore sopra il lunotto */
    .rear-spoiler-lip {
      position: absolute;
      bottom: 11px;
      left: 4px;
      right: 4px;
      height: 2px;
      background: #334155;
      border-radius: 2px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }

    /* Firma luminosa posteriore a barra LED a tutta larghezza (ispirata a Mégane IV) */
    .rear-lightbar-strip {
      position: absolute;
      bottom: 2px;
      left: 2px;
      right: 2px;
      height: 3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .rear-led-left, .rear-led-right {
      width: 8px;
      height: 2.5px;
      background: #ef4444;
      border-radius: 2px;
      box-shadow: 0 0 10px #ef4444, 0 0 4px #ff8888;
    }
    .rear-center-led {
      flex: 1;
      height: 1.5px;
      background: #dc2626;
      margin: 0 2px;
      box-shadow: 0 0 6px #ef4444;
    }

    /* Specchietti laterali aerodinamici */
    .side-mirror-left {
      position: absolute;
      top: 18px;
      left: -3px;
      width: 4px;
      height: 5px;
      background: #475569;
      border-radius: 2px 0 0 2px;
      border-left: 1px solid white;
    }
    .side-mirror-right {
      position: absolute;
      top: 18px;
      right: -3px;
      width: 4px;
      height: 5px;
      background: #475569;
      border-radius: 0 2px 2px 0;
      border-right: 1px solid white;
    }


    #toast {
      position: absolute;
      bottom: max(90px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 700;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Mappa WebGL Reale con MapLibre GL JS -->
  <div id="map"></div>

  <!-- Cartello Limite Velocità -->
  <div id="speed-limit-sign">50</div>

  <!-- Controlli Rapidi a Destra -->
  <div class="map-controls-right">
    <button class="control-btn" onclick="ricentraSuPosizione()" title="La mia posizione">
      <i data-lucide="crosshair" style="width:20px; height:20px;"></i>
    </button>
    <button class="control-btn" onclick="toggleAudio()" id="btn-audio" title="Guida vocale">
      <i data-lucide="volume-2" id="audio-icon" style="width:20px; height:20px;"></i>
    </button>
  </div>

  <!-- Barra Ricerca -->
  <div id="search-panel">
    <div class="search-box">
      <i data-lucide="compass" style="width:20px; height:20px; color:var(--easylink-cyan);"></i>
      <input type="text" id="destination-input" placeholder="Cerca destinazione o tocca la mappa..." autocomplete="off">
      <button onclick="pulisciRicerca()" id="btn-clear-search" style="background:none; border:none; color:var(--text-muted); display:none; cursor:pointer;">
        <i data-lucide="x" style="width:16px; height:16px;"></i>
      </button>
    </div>
    <div id="search-results"></div>
  </div>

  <!-- Top Navigation HUD -->
  <div id="nav-header-easylink">
    <div class="nav-main-row">
      <div class="maneuver-badge-box" id="maneuver-badge">
        <i data-lucide="arrow-up" style="width:30px; height:30px;"></i>
      </div>
      <div class="maneuver-content">
        <div class="maneuver-dist-row">
          <span class="maneuver-distance-val" id="maneuver-dist-val">-- m</span>
          <span class="maneuver-stage-tag" id="maneuver-stage-tag">Crociera</span>
        </div>
        <div class="maneuver-street-name" id="maneuver-next-street">Procedi dritto</div>
      </div>
      <button onclick="interrompiGuida()" style="background:transparent; border:none; color:#ef4444; cursor:pointer; padding:6px;">
        <i data-lucide="x-circle" style="width:24px; height:24px;"></i>
      </button>
    </div>

    <!-- Barra avvicinamento -->
    <div class="approach-progress-bar">
      <div class="approach-progress-fill" id="approach-fill"></div>
    </div>

    <!-- Lane Guidance -->
    <div id="lane-guidance">
      <span style="font-size:11px; color:var(--text-muted); font-weight:700; margin-right:4px;">CORSIE:</span>
      <div class="lane-arrow" id="lane-0"><i data-lucide="arrow-up" style="width:16px; height:16px;"></i></div>
      <div class="lane-arrow active" id="lane-1"><i data-lucide="corner-up-right" style="width:16px; height:16px;"></i></div>
      <div class="lane-arrow" id="lane-2"><i data-lucide="corner-up-right" style="width:16px; height:16px;"></i></div>
    </div>
  </div>

  <!-- Pillola Strada Attuale -->
  <div id="current-street-pill">
    <i data-lucide="map-pin" style="width:14px; height:14px; color:var(--easylink-cyan);"></i>
    <span id="current-street-text">In attesa di posizione...</span>
  </div>

  <!-- Footer Info Viaggio -->
  <div id="nav-footer-easylink">
    <div class="footer-stat-box">
      <div class="footer-stat-val" id="footer-eta">--:--</div>
      <div class="footer-stat-lbl">Arrivo Previsto</div>
    </div>
    <div class="footer-stat-box">
      <div class="footer-stat-val" id="footer-km">-- km</div>
      <div class="footer-stat-lbl">Distanza</div>
    </div>
    <div class="footer-stat-box">
      <div class="footer-stat-val" id="footer-min">-- min</div>
      <div class="footer-stat-lbl">Durata</div>
    </div>
    <button id="btn-start-drive" onclick="avviaGuidaEasyLink()" style="background:var(--easylink-green); color:white; border:none; padding:10px 18px; border-radius:12px; font-weight:800; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:6px;">
      <i data-lucide="play" style="width:16px; height:16px;"></i>
      <span>Parti</span>
    </button>
  </div>

  <div id="toast"></div>

    <!-- Three.js (Motore 3D per Vettura Mesh Poligonale Reale) -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <script>
    lucide.createIcons();

    // Stato
    let userLocation = { lat: 39.3175, lon: 16.2736 }; // Cosenza/Rende
    let userHeading = 0;
    let userSpeedKmh = 50;
    let destLocation = null;
    let activeRoute = null;
    let isNavigating = false;
    let voiceEnabled = true;
    let currentStepIndex = 0;
    let initialStepDistance = 1;
    let isUserInteracting = false;

    // INIZIALIZZAZIONE MAPPA CON MAPLIBRE GL JS
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/bright',
      center: [userLocation.lon, userLocation.lat],
      zoom: 16,
      pitch: 45,
      bearing: 0,
      attributionControl: false
    });

    map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

    // COSTRUZIONE PROCEDURALE VETTURA 3D (Mesh Poligonale Reale Three.js)
    // Proporzioni dalla scheda tecnica Mégane IV: Lunghezza 4.36m, Larghezza 1.82m, Altezza 1.44m
    function creaVettura3D() {
      const car = new THREE.Group();

      // Materiali Fotorealistici PBR con riflessi metallizzati
      const verniceGrigioTitanio = new THREE.MeshStandardMaterial({
        color: 0x475569,
        metalness: 0.85,
        roughness: 0.28
      });

      const cristalliOscurati = new THREE.MeshStandardMaterial({
        color: 0x0a0f1d,
        metalness: 0.95,
        roughness: 0.08,
        transparent: true,
        opacity: 0.95
      });

      const gommaPneumatico = new THREE.MeshStandardMaterial({
        color: 0x111827,
        roughness: 0.85,
        metalness: 0.2
      });

      const cerchioLega = new THREE.MeshStandardMaterial({
        color: 0xe2e8f0,
        metalness: 0.95,
        roughness: 0.15
      });

      // Firma luminosa posteriore a tutta larghezza (Mégane style de-branded)
      const barraLedRossa = new THREE.MeshStandardMaterial({
        color: 0xef4444,
        emissive: 0xef4444,
        emissiveIntensity: 2.8
      });

      const fariLedAnteriori = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0x38bdf8,
        emissiveIntensity: 2.5
      });

      // 1. Scocca inferiore Hatchback (1.82m x 4.36m x 0.60m)
      const chassisGeom = new THREE.BoxGeometry(1.82, 4.36, 0.58);
      const chassis = new THREE.Mesh(chassisGeom, verniceGrigioTitanio);
      chassis.position.z = 0.44;
      car.add(chassis);

      // Muso anteriore affusolato
      const noseGeom = new THREE.BoxGeometry(1.76, 0.8, 0.45);
      const nose = new THREE.Mesh(noseGeom, verniceGrigioTitanio);
      nose.position.set(0, 1.85, 0.38);
      car.add(nose);

      // 2. Abitacolo / Cristalli (Greenhouse compatto con parabrezza inclinato)
      const cabinGeom = new THREE.BoxGeometry(1.52, 2.45, 0.58);
      const cabin = new THREE.Mesh(cabinGeom, cristalliOscurati);
      cabin.position.set(0, -0.32, 0.96);
      car.add(cabin);

      // 3. Tettuccio panoramico
      const roofGeom = new THREE.BoxGeometry(1.46, 1.85, 0.05);
      const roof = new THREE.Mesh(roofGeom, verniceGrigioTitanio);
      roof.position.set(0, -0.32, 1.26);
      car.add(roof);

      // 4. Spoiler aerodinamico posteriore
      const spoilerGeom = new THREE.BoxGeometry(1.54, 0.32, 0.06);
      const spoiler = new THREE.Mesh(spoilerGeom, verniceGrigioTitanio);
      spoiler.position.set(0, -1.60, 1.26);
      car.add(spoiler);

      // 5. Firma luminosa posteriore: Barra LED orizzontale a tutta larghezza
      const rearBarGeom = new THREE.BoxGeometry(1.74, 0.08, 0.09);
      const rearBar = new THREE.Mesh(rearBarGeom, barraLedRossa);
      rearBar.position.set(0, -2.18, 0.54);
      car.add(rearBar);

      // 6. Fari anteriori C-Shape Full LED
      const frontLeft = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.08, 0.12), fariLedAnteriori);
      frontLeft.position.set(-0.68, 2.18, 0.48);
      const frontRight = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.08, 0.12), fariLedAnteriori);
      frontRight.position.set(0.68, 2.18, 0.48);
      car.add(frontLeft);
      car.add(frontRight);

      // 7. Quattro Ruote Volumetriche con Pneumatici e Cerchi in Lega
      const wheelGeom = new THREE.CylinderGeometry(0.33, 0.33, 0.24, 16);
      wheelGeom.rotateZ(Math.PI / 2);

      const rimGeom = new THREE.CylinderGeometry(0.22, 0.22, 0.25, 8);
      rimGeom.rotateZ(Math.PI / 2);

      const ruoteCoord = [
        [-0.91,  1.32, 0.33], // Anteriore SX
        [ 0.91,  1.32, 0.33], // Anteriore DX
        [-0.91, -1.32, 0.33], // Posteriore SX
        [ 0.91, -1.32, 0.33]  // Posteriore DX
      ];

      ruoteCoord.forEach(pos => {
        const wheel = new THREE.Mesh(wheelGeom, gommaPneumatico);
        wheel.position.set(pos[0], pos[1], pos[2]);
        car.add(wheel);

        const rim = new THREE.Mesh(rimGeom, cerchioLega);
        rim.position.set(pos[0], pos[1], pos[2]);
        car.add(rim);
      });

      // 8. Ombra morbida al suolo (Ambient Occlusion)
      const shadowGeom = new THREE.PlaneGeometry(2.3, 4.8);
      const shadowMat = new THREE.MeshBasicMaterial({
        color: 0x000000,
        transparent: true,
        opacity: 0.55
      });
      const shadowPlane = new THREE.Mesh(shadowGeom, shadowMat);
      shadowPlane.position.set(0, 0, 0.02);
      car.add(shadowPlane);

      return car;
    }

    // Configurazione Layer Personalizzato WebGL Three.js per MapLibre
    let threeRenderer, threeScene, threeCamera, car3DMesh;

    const threeCarLayer = {
      id: 'threejs-car-layer',
      type: 'custom',
      renderingMode: '3d',
      onAdd: function (m, gl) {
        threeCamera = new THREE.Camera();
        threeScene = new THREE.Scene();

        // Illuminazione Ambientale e Direzionale per Riflessi Carrozzeria
        const ambient = new THREE.AmbientLight(0xffffff, 0.8);
        threeScene.add(ambient);

        const sole = new THREE.DirectionalLight(0xffffff, 1.4);
        sole.position.set(20, -50, 70).normalize();
        threeScene.add(sole);

        const luceFiancata = new THREE.DirectionalLight(0x00b4d8, 0.5);
        luceFiancata.position.set(-30, 40, 30).normalize();
        threeScene.add(luceFiancata);

        car3DMesh = creaVettura3D();
        threeScene.add(car3DMesh);

        threeRenderer = new THREE.WebGLRenderer({
          canvas: m.getCanvas(),
          context: gl,
          antialias: true
        });
        threeRenderer.autoClear = false;
      },
      render: function (gl, args) {
        if (!car3DMesh) return;

        // Calcola coordinate Mercator per ancorare l'auto al suolo
        const merc = maplibregl.MercatorCoordinate.fromLngLat([userLocation.lon, userLocation.lat], 0);

        // Scala in metri: a zoom ravvicinato (16-19) scala reale 1:1, a zoom lontano mantiene visibilità
        const currentZoom = map.getZoom();
        const baseScale = merc.meterInMercatorCoordinateUnits();
        const zoomBoost = currentZoom < 15.5 ? Math.pow(1.3, 15.5 - currentZoom) : 1.0;
        const finalScale = baseScale * zoomBoost;

        const rotationX = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(1, 0, 0), Math.PI / 2);
        const rotationZ = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(0, 0, 1), -(userHeading * Math.PI) / 180);

        // Matrice di proiezione MapLibre
        const matrixArray = (args && args.length === 16) ? args : (args && args.defaultProjectionData ? args.defaultProjectionData.mainMatrix : map.transform.projMatrix);
        if (!matrixArray || matrixArray.length !== 16) return;

        const projMat = new THREE.Matrix4().fromArray(matrixArray);
        const modelMat = new THREE.Matrix4()
          .makeTranslation(merc.x, merc.y, merc.z)
          .scale(new THREE.Vector3(finalScale, -finalScale, finalScale))
          .multiply(rotationX)
          .multiply(rotationZ);

        threeCamera.projectionMatrix = projMat.multiply(modelMat);
        threeRenderer.resetState();
        threeRenderer.render(threeScene, threeCamera);
        map.triggerRepaint();
      }
    };

    let destMarker = null;

    // 1. CARICAMENTO LAYER 3D EDIFICI E ROTTA
    map.on('load', () => {
      // Inserisce l'auto 3D WebGL Three.js sopra il terreno e sotto le etichette
      try {
        map.addLayer(threeCarLayer);
      } catch (e) {
        console.error("Three.js car layer error:", e);
      }

      const layers = map.getStyle().layers;
      let labelLayerId;
      for (let i = 0; i < layers.length; i++) {
        if (layers[i].type === 'symbol' && layers[i].layout && layers[i].layout['text-field']) {
          labelLayerId = layers[i].id;
          break;
        }
      }

      // Edifici 3D Estrusi
      try {
        map.addLayer({
          'id': '3d-buildings-extrusion',
          'source': 'openmaptiles',
          'source-layer': 'building',
          'type': 'fill-extrusion',
          'minzoom': 13,
          'paint': {
            'fill-extrusion-color': [
              'interpolate',
              ['linear'],
              ['get', 'render_height'],
              0, '#d1d5db',
              30, '#94a3b8',
              80, '#64748b'
            ],
            'fill-extrusion-height': [
              'interpolate',
              ['linear'],
              ['zoom'],
              13, 0,
              15.5, ['get', 'render_height']
            ],
            'fill-extrusion-base': [
              'interpolate',
              ['linear'],
              ['zoom'],
              13, 0,
              15.5, ['get', 'render_min_height']
            ],
            'fill-extrusion-opacity': 0.88
          }
        }, labelLayerId);
      } catch (e) {
        console.warn("3D extrusion:", e);
      }

      // Tracciato Rotta
      map.addSource('route-source', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] }
      });

      map.addLayer({
        id: 'route-glow-layer',
        type: 'line',
        source: 'route-source',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': '#00b4d8',
          'line-width': 12,
          'line-opacity': 0.4,
          'line-blur': 4
        }
      });

      map.addLayer({
        id: 'route-line-layer',
        type: 'line',
        source: 'route-source',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': '#0072ce',
          'line-width': 7,
          'line-opacity': 0.95
        }
      });
    });

    // 2. FORMULA CONTINUA: ZOOM <-> INCLINAZIONE 3D
    // Più sei vicino (zoom alto) -> più scendi in 3D "da dietro l'auto" (pitch fino a 70°)
    // Più sei lontano (zoom basso) -> più la mappa si raddrizza in 2D dall'alto (pitch 0°)
    function calcolaPitchDaZoom(z) {
      if (z <= 12.0) return 0;   // Lontano: 100% 2D zenitale (0°)
      if (z >= 18.5) return 70;  // Vicino: vista 3D ripida da dietro (70°)
      // Interpolazione lineare continua
      return ((z - 12.0) / (18.5 - 12.0)) * 70;
    }

    // Gestione zoom manuale dell'utente (pinch/rotella): adatta l'inclinazione 3D in tempo reale
    map.on('movestart', () => { isUserInteracting = true; });
    map.on('moveend', () => { isUserInteracting = false; });

    map.on('zoom', () => {
      if (isUserInteracting) {
        const targetPitch = calcolaPitchDaZoom(map.getZoom());
        map.setPitch(targetPitch);
      }
    });

    // RILEVAMENTO GPS REALE
    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition(pos => {
        userLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        map.triggerRepaint();
        aggiornaTelecameraAutomotive(16);
        aggiornaNomeStradaAttuale(userLocation);
      }, null, { enableHighAccuracy: true });

      navigator.geolocation.watchPosition(pos => {
        userLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        map.triggerRepaint();

        if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
          userHeading = pos.coords.heading;
          map.triggerRepaint();
        }
        if (pos.coords.speed !== null && !isNaN(pos.coords.speed)) {
          userSpeedKmh = Math.round(pos.coords.speed * 3.6);
          aggiornaLimiteVelocita(userSpeedKmh);
        }

        if (isNavigating) aggiornaGuidaEasyLink();
        else if (!isUserInteracting) aggiornaTelecameraAutomotive();
      }, null, { enableHighAccuracy: true, maximumAge: 1000 });
    }

    // TELECAMERA AUTOMOTIVE DINAMICA
    function aggiornaTelecameraAutomotive(targetZoom = null) {
      const z = targetZoom || map.getZoom();
      const p = calcolaPitchDaZoom(z);

      map.easeTo({
        center: [userLocation.lon, userLocation.lat],
        pitch: p,
        bearing: userHeading,
        zoom: z,
        duration: 350
      });
    }

    function ricentraSuPosizione() {
      isUserInteracting = false;
      aggiornaTelecameraAutomotive(16.5);
      showToast("Visuale riallineata");
    }

    // 3. RICERCA INDIRIZZI
    const searchInput = document.getElementById('destination-input');
    const resultsBox = document.getElementById('search-results');
    let debounceSearch = null;

    searchInput.addEventListener('input', e => {
      const q = e.target.value.trim();
      document.getElementById('btn-clear-search').style.display = q ? 'block' : 'none';
      clearTimeout(debounceSearch);
      if (q.length < 3) { resultsBox.style.display = 'none'; return; }

      debounceSearch = setTimeout(async () => {
        const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=5&lat=${userLocation.lat}&lon=${userLocation.lon}`;
        try {
          const res = await fetch(url);
          const data = await res.json();
          renderRisultati(data.features || []);
        } catch(err) { console.error(err); }
      }, 300);
    });

    function renderRisultati(features) {
      if (!features.length) { resultsBox.style.display = 'none'; return; }
      resultsBox.innerHTML = '';
      features.forEach(f => {
        const p = f.properties;
        const [lon, lat] = f.geometry.coordinates;
        const div = document.createElement('div');
        div.className = 'result-item';
        div.innerHTML = `<span class="result-title">${p.name || p.street || 'Destinazione'}</span>
                         <span class="result-sub">${[p.city, p.county, p.country].filter(Boolean).join(', ')}</span>`;
        div.onclick = () => {
          searchInput.value = p.name || p.street;
          resultsBox.style.display = 'none';
          impostaDestinazione(lat, lon, p.name || p.street);
        };
        resultsBox.appendChild(div);
      });
      resultsBox.style.display = 'flex';
    }

    map.on('click', e => {
      if (isNavigating) return;
      impostaDestinazione(e.lngLat.lat, e.lngLat.lng, "Punto selezionato");
    });

    function pulisciRicerca() {
      searchInput.value = '';
      document.getElementById('btn-clear-search').style.display = 'none';
      resultsBox.style.display = 'none';
      if (destMarker) destMarker.remove();
      if (map.getSource('route-source')) {
        map.getSource('route-source').setData({ type: 'FeatureCollection', features: [] });
      }
      document.getElementById('nav-footer-easylink').style.display = 'none';
      activeRoute = null;
    }

    // 4. CALCOLO ROTTA OSRM
    async function impostaDestinazione(lat, lon, label) {
      destLocation = { lat, lon, name: label };
      if (destMarker) destMarker.remove();

      const el = document.createElement('div');
      el.innerHTML = `<div style="background:#ef4444; width:34px; height:34px; border-radius:50%; border:3px solid white; display:flex; align-items:center; justify-content:center; color:white; box-shadow:0 0 20px #ef4444;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>
                      </div>`;
      destMarker = new maplibregl.Marker({ element: el }).setLngLat([lon, lat]).addTo(map);

      await calcolaPercorso();
    }

    async function calcolaPercorso() {
      showToast("Calcolo itinerario...");
      const url = `https://router.project-osrm.org/route/v1/driving/${userLocation.lon},${userLocation.lat};${destLocation.lon},${destLocation.lat}?overview=full&geometries=geojson&steps=true`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!data.routes || !data.routes.length) {
          showToast("Nessun percorso trovato.");
          return;
        }

        activeRoute = data.routes[0];

        if (map.getSource('route-source')) {
          map.getSource('route-source').setData({
            type: 'Feature',
            geometry: activeRoute.geometry
          });
        }

        // Mostra intera rotta: da lontano è raddrizzata (pitch basso) per una panoramica chiara
        const coords = activeRoute.geometry.coordinates;
        const bounds = coords.reduce((b, coord) => b.extend(coord), new maplibregl.LngLatBounds(coords[0], coords[0]));
        map.fitBounds(bounds, { padding: 80, pitch: 20 });

        const km = (activeRoute.distance / 1000).toFixed(1);
        const min = Math.round(activeRoute.duration / 60);
        document.getElementById('footer-km').innerText = `${km} km`;
        document.getElementById('footer-min').innerText = `${min} min`;

        const eta = new Date();
        eta.setSeconds(eta.getSeconds() + activeRoute.duration);
        document.getElementById('footer-eta').innerText = eta.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        document.getElementById('nav-footer-easylink').style.display = 'flex';
      } catch (err) {
        showToast("Errore di rete.");
      }
    }

    // 5. GUIDA ATTIVA CON CAMBIO PROSPETTIVA LEGATO ALLO ZOOM
    function avviaGuidaEasyLink() {
      if (!activeRoute) return;
      isNavigating = true;
      currentStepIndex = 0;

      document.getElementById('search-panel').style.display = 'none';
      document.getElementById('nav-header-easylink').style.display = 'flex';
      document.getElementById('btn-start-drive').style.display = 'none';

      const step = activeRoute.legs[0].steps[0];
      initialStepDistance = step.distance || 300;

      aggiornaGuidaEasyLink();
      parlaEasyLink();
    }

    function interrompiGuida() {
      isNavigating = false;
      document.getElementById('search-panel').style.display = 'flex';
      document.getElementById('nav-header-easylink').style.display = 'none';
      document.getElementById('btn-start-drive').style.display = 'flex';
    }

    function aggiornaGuidaEasyLink() {
      const steps = activeRoute.legs[0].steps;
      if (currentStepIndex >= steps.length) {
        showToast("Destinazione raggiunta");
        interrompiGuida();
        return;
      }

      const step = steps[currentStepIndex];
      const stepLoc = step.maneuver.location; // [lon, lat]
      const dist = distanzaMetri(userLocation.lat, userLocation.lon, stepLoc[1], stepLoc[0]);

      if (dist < 20 && currentStepIndex < steps.length - 1) {
        currentStepIndex++;
        const nextStep = steps[currentStepIndex];
        initialStepDistance = nextStep.distance || 200;
        aggiornaGuidaEasyLink();
        parlaEasyLink();
        return;
      }

      document.getElementById('maneuver-dist-val').innerText = dist > 1000 ? `${(dist/1000).toFixed(1)} km` : `${Math.round(dist)} m`;
      document.getElementById('maneuver-next-street').innerText = step.name || "Continua sul percorso";

      const progressPercent = Math.max(0, Math.min(100, 100 - (dist / Math.max(initialStepDistance, 100)) * 100));
      document.getElementById('approach-fill').style.width = `${progressPercent}%`;

      const stageTag = document.getElementById('maneuver-stage-tag');
      const laneBox = document.getElementById('lane-guidance');

      // GESTIONE PROSPETTIVA A SECONDA DELLA DISTANZA:
      let targetZoom = 15.5;

      if (dist > 400) {
        // LONTANO DALL'INCROCIO (Crociera / Autostrada):
        // Zoom allargato (14.5) -> Inclinazione bassa (25°), visuale panoramica dall'alto quasi 2D
        targetZoom = userSpeedKmh > 75 ? 14.0 : 15.0;
        stageTag.innerText = "Crociera Panoramica";
        stageTag.style.color = "var(--easylink-cyan)";
        laneBox.style.display = "none";
      } else if (dist <= 400 && dist > 120) {
        // IN AVVICINAMENTO:
        // Zoom intermedio (16.8) -> Inclinazione decisa (50°), si abbassa dietro l'auto
        targetZoom = 16.8;
        stageTag.innerText = "Avvicinamento";
        stageTag.style.color = "#f59e0b";
        laneBox.style.display = "flex";
      } else {
        // ALL'INCROCIO / ROTONDA:
        // Zoom ravvicinato (18.5) -> Inclinazione massima (70°), piena visuale 3D alle spalle del veicolo con palazzi estrusi
        targetZoom = 18.5;
        stageTag.innerText = "Incrocio 3D";
        stageTag.style.color = "var(--easylink-green)";
        laneBox.style.display = "flex";
      }

      if (!isUserInteracting) {
        aggiornaTelecameraAutomotive(targetZoom);
      }

      aggiornaIconaManovra(step);
      aggiornaNomeStradaAttuale(userLocation);
    }

    function aggiornaIconaManovra(step) {
      const mod = step.maneuver.modifier || '';
      const type = step.maneuver.type;
      let icon = 'arrow-up';
      if (mod.includes('right')) icon = 'corner-up-right';
      else if (mod.includes('left')) icon = 'corner-up-left';
      else if (type === 'roundabout') icon = 'rotate-cw';
      else if (type === 'arrive') icon = 'flag';

      document.getElementById('maneuver-badge').innerHTML = `<i data-lucide="${icon}" style="width:30px; height:30px;"></i>`;
      lucide.createIcons();
    }

    function parlaEasyLink() {
      const step = activeRoute.legs[0].steps[currentStepIndex];
      let testo = "";
      const mod = step.maneuver.modifier;
      const via = step.name ? `in ${step.name}` : "";
      if (mod && mod.includes('right')) testo = `In 300 metri, gira a destra ${via}`;
      else if (mod && mod.includes('left')) testo = `In 300 metri, gira a sinistra ${via}`;
      else if (step.maneuver.type === 'roundabout') testo = `Alla rotonda prendi l'uscita ${via}`;
      else if (step.maneuver.type === 'arrive') testo = "Sei arrivato a destinazione";
      else testo = `Continua dritto ${via}`;

      if (voiceEnabled && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(testo);
        u.lang = 'it-IT';
        window.speechSynthesis.speak(u);
      }
    }

    function toggleAudio() {
      voiceEnabled = !voiceEnabled;
      const icon = document.getElementById('audio-icon');
      icon.setAttribute('data-lucide', voiceEnabled ? 'volume-2' : 'volume-x');
      lucide.createIcons();
      showToast(voiceEnabled ? "Guida vocale attiva" : "Guida vocale disattivata");
    }

    function aggiornaLimiteVelocita(speed) {
      const sign = document.getElementById('speed-limit-sign');
      if (speed > 100) sign.innerText = "130";
      else if (speed > 60) sign.innerText = "90";
      else sign.innerText = "50";
    }

    let lastStreetCheck = 0;
    async function aggiornaNomeStradaAttuale(loc) {
      const now = Date.now();
      if (now - lastStreetCheck < 8000) return;
      lastStreetCheck = now;
      try {
        const res = await fetch(`https://photon.komoot.io/reverse?lon=${loc.lon}&lat=${loc.lat}`);
        const data = await res.json();
        if (data.features && data.features.length) {
          const p = data.features[0].properties;
          const street = p.street || p.name || p.city || "Carreggiata";
          document.getElementById('current-street-text').innerText = street;
        }
      } catch(e) {}
    }

    function distanzaMetri(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg error:', err));
      });
    }
  </script>
