<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AuraRoute — Navigatore Reale con Joystick & Auto-Zoom</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.94);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #2563eb;
      --nav-green: #10b981;
      --nav-cyan: #06b6d4;
      --nav-red: #ef4444;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #e5e7eb;
    }

    /* Floating Search Bar */
    #search-container {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      max-width: 480px;
      z-index: 400;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      outline: none;
    }
    .search-input::placeholder {
      color: var(--text-muted);
    }

    /* Dropdown Suggerimenti */
    #suggestions {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-height: 220px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .suggestion-item {
      padding: 12px 14px;
      font-size: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .suggestion-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .suggestion-title {
      font-weight: 600;
      color: white;
    }
    .suggestion-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Turn-by-Turn Navigation HUD (Top) */
    #nav-hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      max-width: 520px;
      margin: 0 auto;
      z-index: 500;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
      padding: 14px 18px;
      display: none;
      align-items: center;
      gap: 16px;
    }

    .maneuver-icon-container {
      width: 48px;
      height: 48px;
      background: var(--nav-green);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      flex-shrink: 0;
    }

    .maneuver-text {
      flex: 1;
      overflow: hidden;
    }

    .maneuver-distance {
      font-size: 22px;
      font-weight: 800;
      color: white;
      line-height: 1.1;
    }

    .maneuver-street {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 4px;
    }

    .junction-zoom-badge {
      font-size: 11px;
      color: var(--nav-cyan);
      background: rgba(6, 182, 212, 0.15);
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 700;
      border: 1px solid rgba(6, 182, 212, 0.3);
      display: none;
    }

    /* Bottom Status Bar */
    #bottom-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px 20px;
      display: none;
      align-items: center;
      gap: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      width: 90%;
      max-width: 460px;
      justify-content: space-between;
    }

    .stat-group {
      display: flex;
      flex-direction: column;
    }
    .stat-value {
      font-size: 17px;
      font-weight: 800;
      color: white;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .btn-start {
      background: var(--nav-green);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-stop {
      background: var(--nav-red);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    /* Floating Map Controls (Destra) */
    .map-controls {
      position: absolute;
      right: 16px;
      bottom: 100px;
      z-index: 400;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .fab {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    }
    .fab.active {
      border-color: var(--nav-cyan);
      color: var(--nav-cyan);
    }

    /* JOYSTICK VIRTUALE (In basso a sinistra) */
    #joystick-panel {
      position: absolute;
      bottom: 24px;
      left: 20px;
      z-index: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .joystick-title {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--nav-cyan);
    }

    #joystick-base {
      width: 110px;
      height: 110px;
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      position: relative;
      touch-action: none;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #joystick-stick {
      width: 46px;
      height: 46px;
      background: var(--accent);
      border: 3px solid white;
      border-radius: 50%;
      position: absolute;
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.8);
      pointer-events: none;
      transition: transform 0.05s linear;
    }

    .keyboard-hint {
      font-size: 9px;
      color: var(--text-muted);
      text-align: center;
    }

    /* Veicolo e Cursore */
    .car-marker {
      width: 38px;
      height: 38px;
      background: #0284c7;
      border: 3px solid white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 0 20px rgba(2, 132, 199, 0.9);
      transition: transform 0.15s ease-out;
    }

    /* Freccia Incrocio Sull'Asfalto */
    .junction-arrow-marker {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulseGlow 1.5s infinite alternate;
    }

    @keyframes pulseGlow {
      from { transform: scale(0.95); opacity: 0.85; }
      to { transform: scale(1.15); opacity: 1; }
    }

    #toast {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 700;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Mappa -->
  <div id="map"></div>

  <!-- Barra Ricerca -->
  <div id="search-container">
    <div class="search-card">
      <div class="search-row">
        <i data-lucide="navigation" style="width:18px; height:18px; color:#3b82f6;"></i>
        <input type="text" id="dest-input" class="search-input" placeholder="Cerca destinazione o tocca la mappa..." autocomplete="off">
        <button id="btn-clear" onclick="pulisciDestinazione()" style="background:none; border:none; color:var(--text-muted); display:none; cursor:pointer;">
          <i data-lucide="x" style="width:16px; height:16px;"></i>
        </button>
      </div>
    </div>
    <div id="suggestions"></div>
  </div>

  <!-- Top Turn-by-Turn HUD con Indicatore Auto-Zoom Incrocio -->
  <div id="nav-hud">
    <div class="maneuver-icon-container" id="hud-icon">
      <i data-lucide="arrow-up" style="width:26px; height:26px;"></i>
    </div>
    <div class="maneuver-text">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="maneuver-distance" id="hud-dist">-- m</span>
        <span class="junction-zoom-badge" id="hud-zoom-badge">🔍 Zoom Incrocio</span>
      </div>
      <div class="maneuver-street" id="hud-street">In attesa del percorso...</div>
    </div>
    <button onclick="fermaNavigazione()" class="btn-stop">Esci</button>
  </div>

  <!-- Joystick per test da fermo -->
  <div id="joystick-panel">
    <div class="joystick-title">🕹️ Guida Manuale</div>
    <div id="joystick-base">
      <div id="joystick-stick"></div>
    </div>
    <div class="keyboard-hint">Trascina o usa tasti W A S D</div>
  </div>

  <!-- Bottom Trip Status -->
  <div id="bottom-bar">
    <div class="stat-group">
      <span class="stat-value" id="stat-time">-- min</span>
      <span class="stat-label" id="stat-eta">ETA: --:--</span>
    </div>
    <div class="stat-group">
      <span class="stat-value" id="stat-dist">-- km</span>
      <span class="stat-label">Distanza</span>
    </div>
    <button class="btn-start" id="btn-start-nav" onclick="avviaNavigazione()">
      <i data-lucide="play" style="width:16px; height:16px;"></i>
      <span>Avvia</span>
    </button>
  </div>

  <!-- Controlli Flottanti Mappa -->
  <div class="map-controls">
    <button class="fab" onclick="centraSuPosizione()" title="La mia posizione">
      <i data-lucide="crosshair" style="width:20px; height:20px;"></i>
    </button>
    <button class="fab" onclick="toggleJoystick()" id="btn-toggle-joy" title="Mostra/Nascondi Joystick" class="active">
      <i data-lucide="gamepad-2" style="width:20px; height:20px;"></i>
    </button>
    <button class="fab" onclick="toggleAudio()" id="btn-audio" title="Guida vocale">
      <i data-lucide="volume-2" id="audio-icon" style="width:20px; height:20px;"></i>
    </button>
  </div>

  <div id="toast"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    lucide.createIcons();

    // Stato Navigatore
    let userLocation = { lat: 39.3175, lon: 16.2736 }; // Default Cosenza/Rende se GPS non risponde subito
    let userHeading = 0; // Gradi bussola
    let userSpeed = 0; // km/h
    let destLocation = null;
    let activeRoute = null;
    let isNavigating = false;
    let voiceEnabled = true;
    let currentStepIndex = 0;
    let joystickActive = true;

    // Inizializza Mappa con OpenStreetMap standard 100% libera e senza chiavi
    const map = L.map('map', { zoomControl: false }).setView([userLocation.lat, userLocation.lon], 15);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    let routeLayer = null;
    let destMarker = null;
    let junctionArrowMarker = null; // Freccia 3D / grafica sull'asfalto all'incrocio

    // Marker Veicolo
    const carIcon = L.divIcon({
      className: 'car-marker-wrap',
      html: `<div class="car-marker" id="car-vehicle-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polygon points="12 2 19 21 12 17 5 21 12 2" fill="white"/>
              </svg>
             </div>`,
      iconSize: [38, 38],
      iconAnchor: [19, 19]
    });
    let userMarker = L.marker([userLocation.lat, userLocation.lon], { icon: carIcon }).addTo(map);

    // 1. Rilevamento GPS Reale
    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          userLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude };
          userMarker.setLatLng([userLocation.lat, userLocation.lon]);
          map.setView([userLocation.lat, userLocation.lon], 16);
          showToast("GPS attivo");
        },
        err => console.log("GPS default attivo"),
        { enableHighAccuracy: true }
      );

      navigator.geolocation.watchPosition(
        pos => {
          // Se stiamo usando il joystick manuale ignoriamo il sensore per non sovrascrivere
          if (isJoystickDriving) return;
          userLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude };
          userMarker.setLatLng([userLocation.lat, userLocation.lon]);
          if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
            impostaHeading(pos.coords.heading);
          }
          if (isNavigating && activeRoute) {
            aggiornaNavigazioneConAutoZoom();
          }
        },
        err => console.warn(err),
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    }

    function impostaHeading(gradi) {
      userHeading = gradi;
      const el = document.getElementById('car-vehicle-icon');
      if (el) el.style.transform = `rotate(${gradi}deg)`;
    }

    // 2. Click su Mappa per scegliere destinazione
    map.on('click', e => {
      if (isNavigating) return;
      impostaDestinazione(e.latlng.lat, e.latlng.lng, "Punto selezionato");
    });

    // 3. Ricerca Indirizzi Photon
    const searchInput = document.getElementById('dest-input');
    const suggestionsBox = document.getElementById('suggestions');
    let searchDebounce = null;

    searchInput.addEventListener('input', e => {
      const q = e.target.value.trim();
      document.getElementById('btn-clear').style.display = q ? 'block' : 'none';
      clearTimeout(searchDebounce);

      if (q.length < 3) {
        suggestionsBox.style.display = 'none';
        return;
      }

      searchDebounce = setTimeout(async () => {
        let url = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=5&lat=${userLocation.lat}&lon=${userLocation.lon}`;
        try {
          const res = await fetch(url);
          const data = await res.json();
          renderSuggerimenti(data.features || []);
        } catch (err) { console.error(err); }
      }, 300);
    });

    function renderSuggerimenti(features) {
      if (!features.length) { suggestionsBox.style.display = 'none'; return; }
      suggestionsBox.innerHTML = '';
      features.forEach(f => {
        const p = f.properties;
        const [lon, lat] = f.geometry.coordinates;
        const item = document.createElement('div');
        item.className = 'suggestion-item';
        const name = p.name || p.street || 'Luogo';
        const details = [p.city, p.county, p.country].filter(Boolean).join(', ');
        item.innerHTML = `<span class="suggestion-title">${name}</span><span class="suggestion-sub">${details}</span>`;
        item.onclick = () => {
          searchInput.value = name;
          suggestionsBox.style.display = 'none';
          impostaDestinazione(lat, lon, name);
        };
        suggestionsBox.appendChild(item);
      });
      suggestionsBox.style.display = 'flex';
    }

    function pulisciDestinazione() {
      searchInput.value = '';
      document.getElementById('btn-clear').style.display = 'none';
      suggestionsBox.style.display = 'none';
      if (destMarker) map.removeLayer(destMarker);
      if (routeLayer) map.removeLayer(routeLayer);
      rimuoviFrecciaIncrocio();
      document.getElementById('bottom-bar').style.display = 'none';
      destLocation = null;
      activeRoute = null;
    }

    // 4. Calcolo Rotta OSRM
    async function impostaDestinazione(lat, lon, label) {
      destLocation = { lat, lon, name: label };
      if (destMarker) map.removeLayer(destMarker);
      destMarker = L.marker([lat, lon]).addTo(map).bindPopup(label).openPopup();
      await calcolaRotta(userLocation, destLocation);
    }

    async function calcolaRotta(start, end) {
      showToast("Calcolo percorso in corso...");
      const url = `https://router.project-osrm.org/route/v1/driving/${start.lon},${start.lat};${end.lon},${end.lat}?overview=full&geometries=geojson&steps=true`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!data.routes || !data.routes.length) {
          showToast("Nessuna strada trovata.");
          return;
        }

        activeRoute = data.routes[0];

        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.geoJSON(activeRoute.geometry, {
          style: { color: '#2563eb', weight: 6, opacity: 0.9, lineJoin: 'round' }
        }).addTo(map);

        map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

        const km = (activeRoute.distance / 1000).toFixed(1);
        const min = Math.round(activeRoute.duration / 60);
        document.getElementById('stat-dist').innerText = `${km} km`;
        document.getElementById('stat-time').innerText = `${min} min`;
        
        const eta = new Date();
        eta.setSeconds(eta.getSeconds() + activeRoute.duration);
        document.getElementById('stat-eta').innerText = `ETA: ${eta.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

        document.getElementById('bottom-bar').style.display = 'flex';
      } catch (err) {
        showToast("Errore calcolo rotta.");
      }
    }

    // 5. Avvio Navigazione Turn-by-Turn
    function avviaNavigazione() {
      if (!activeRoute) return;
      isNavigating = true;
      currentStepIndex = 0;

      document.getElementById('search-container').style.display = 'none';
      document.getElementById('nav-hud').style.display = 'flex';
      document.getElementById('btn-start-nav').style.display = 'none';

      map.setZoom(16);
      map.panTo([userLocation.lat, userLocation.lon]);

      aggiornaNavigazioneConAutoZoom();
      parlaManovra();
    }

    function fermaNavigazione() {
      isNavigating = false;
      document.getElementById('search-container').style.display = 'flex';
      document.getElementById('nav-hud').style.display = 'none';
      document.getElementById('btn-start-nav').style.display = 'flex';
      rimuoviFrecciaIncrocio();
      if (routeLayer) map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
    }

    // 6. AUTO-ZOOM DINAMICO ALL'INCROCIO + FRECCIA SULL'ASFALTO
    function aggiornaNavigazioneConAutoZoom() {
      const steps = activeRoute.legs[0].steps;
      if (currentStepIndex >= steps.length) {
        showToast("Destinazione raggiunta!");
        parla("Sei arrivato a destinazione.");
        fermaNavigazione();
        return;
      }

      const step = steps[currentStepIndex];
      const stepLoc = step.maneuver.location; // [lon, lat]
      const dist = distanzaMetri(userLocation.lat, userLocation.lon, stepLoc[1], stepLoc[0]);

      // A. Se siamo a meno di 25 metri, passa alla manovra successiva
      if (dist < 25 && currentStepIndex < steps.length - 1) {
        currentStepIndex++;
        aggiornaNavigazioneConAutoZoom();
        parlaManovra();
        return;
      }

      // B. Aggiorna HUD
      document.getElementById('hud-dist').innerText = dist > 1000 ? `Tra ${(dist/1000).toFixed(1)} km` : `Tra ${Math.round(dist)} m`;
      document.getElementById('hud-street').innerText = step.name || "Continua sul percorso";

      // C. LOGICA AUTO-ZOOM DINAMICO
      // Se siamo vicini all'incrocio (< 150m), la mappa fa lo zoom ravvicinato per vedere l'incrocio nei dettagli!
      const zoomBadge = document.getElementById('hud-zoom-badge');
      if (dist < 80) {
        // Molto vicino: zoom massimo sull'incrocio (zoom 18)
        if (map.getZoom() !== 18) map.setZoom(18, { animate: true });
        zoomBadge.style.display = 'inline-block';
      } else if (dist < 180) {
        // Avvicinamento all'incrocio (zoom 17)
        if (map.getZoom() !== 17) map.setZoom(17, { animate: true });
        zoomBadge.style.display = 'inline-block';
      } else {
        // Sul rettilineo: zoom standard per vedere la strada avanti (zoom 15 o 16)
        if (map.getZoom() > 16) map.setZoom(16, { animate: true });
        zoomBadge.style.display = 'none';
      }

      map.panTo([userLocation.lat, userLocation.lon]);

      // D. FRECCIA SULL'ASFALTO ALL'INCROCIO
      // Se siamo entro 250m dall'incrocio, disegna la freccia luminosa orientata esattamente sul punto di svolta
      if (dist < 250) {
        posizionaFrecciaIncrocio(stepLoc[1], stepLoc[0], step.maneuver.modifier);
      } else {
        rimuoviFrecciaIncrocio();
      }

      aggiornaIconaManovra(step);
    }

    // Disegna la freccia luminosa sulla strada nel punto esatto dell'incrocio
    function posizionaFrecciaIncrocio(lat, lon, modifier) {
      if (!junctionArrowMarker) {
        let rotationDeg = 0;
        if (modifier && modifier.includes('right')) rotationDeg = 90;
        else if (modifier && modifier.includes('left')) rotationDeg = -90;

        const arrowHtml = `
          <div class="junction-arrow-marker" style="transform: rotate(${rotationDeg}deg);">
            <svg width="46" height="46" viewBox="0 0 24 24" fill="none">
              <path d="M12 3L12 21M12 3L5 10M12 3L19 10" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        `;
        const icon = L.divIcon({
          className: 'junction-arrow-wrap',
          html: arrowHtml,
          iconSize: [50, 50],
          iconAnchor: [25, 25]
        });
        junctionArrowMarker = L.marker([lat, lon], { icon }).addTo(map);
      } else {
        junctionArrowMarker.setLatLng([lat, lon]);
      }
    }

    function rimuoviFrecciaIncrocio() {
      if (junctionArrowMarker) {
        map.removeLayer(junctionArrowMarker);
        junctionArrowMarker = null;
      }
    }

    function aggiornaIconaManovra(step) {
      const modifier = step.maneuver.modifier || '';
      const type = step.maneuver.type;
      let iconName = 'arrow-up';
      if (modifier.includes('right')) iconName = 'corner-up-right';
      else if (modifier.includes('left')) iconName = 'corner-up-left';
      else if (type === 'roundabout') iconName = 'rotate-cw';
      else if (type === 'arrive') iconName = 'flag';

      document.getElementById('hud-icon').innerHTML = `<i data-lucide="${iconName}" style="width:26px; height:26px;"></i>`;
      lucide.createIcons();
    }

    // Formula Haversine (distanza in metri)
    function distanzaMetri(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // Guida Vocale
    function parla(testo) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(testo);
      u.lang = 'it-IT';
      window.speechSynthesis.speak(u);
    }

    function parlaManovra() {
      const step = activeRoute.legs[0].steps[currentStepIndex];
      let testo = "";
      const mod = step.maneuver.modifier;
      const via = step.name ? `in ${step.name}` : "";
      if (mod && mod.includes('right')) testo = `Gira a destra ${via}`;
      else if (mod && mod.includes('left')) testo = `Gira a sinistra ${via}`;
      else if (step.maneuver.type === 'roundabout') testo = `Entra nella rotonda ${via}`;
      else if (step.maneuver.type === 'arrive') testo = "Sei arrivato a destinazione";
      else testo = `Procedi dritto ${via}`;
      parla(testo);
    }

    // 7. JOYSTICK VIRTUALE PER GUIDARE DA FERMO
    const joyBase = document.getElementById('joystick-base');
    const joyStick = document.getElementById('joystick-stick');
    let isDraggingJoy = false;
    let isJoystickDriving = false;
    let joyDeltaX = 0;
    let joyDeltaY = 0;
    let joyLoopId = null;

    function handleJoyStart(e) {
      isDraggingJoy = true;
      isJoystickDriving = true;
      updateJoyPos(e);
      if (!joyLoopId) joyLoopId = requestAnimationFrame(joyUpdateLoop);
    }

    function handleJoyMove(e) {
      if (!isDraggingJoy) return;
      updateJoyPos(e);
    }

    function handleJoyEnd() {
      isDraggingJoy = false;
      joyDeltaX = 0;
      joyDeltaY = 0;
      joyStick.style.transform = `translate(0px, 0px)`;
      if (joyLoopId) {
        cancelAnimationFrame(joyLoopId);
        joyLoopId = null;
      }
    }

    function updateJoyPos(e) {
      const rect = joyBase.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const maxRadius = rect.width / 2 - 10;

      let dx = clientX - (rect.left + rect.width / 2);
      let dy = clientY - (rect.top + rect.height / 2);

      const distance = Math.hypot(dx, dy);
      if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
      }

      joyDeltaX = dx / maxRadius; // da -1 a +1
      joyDeltaY = dy / maxRadius; // da -1 a +1

      joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
    }

    joyBase.addEventListener('mousedown', handleJoyStart);
    window.addEventListener('mousemove', handleJoyMove);
    window.addEventListener('mouseup', handleJoyEnd);

    joyBase.addEventListener('touchstart', handleJoyStart, { passive: false });
    window.addEventListener('touchmove', handleJoyMove, { passive: false });
    window.addEventListener('touchend', handleJoyEnd);

    // Supporto tastiera (W A S D o Frecce)
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (['w','a','s','d','arrowup','arrowleft','arrowdown','arrowright'].includes(e.key.toLowerCase())) {
        isJoystickDriving = true;
        if (!joyLoopId) joyLoopId = requestAnimationFrame(joyUpdateLoop);
      }
    });
    window.addEventListener('keyup', e => {
      keys[e.key.toLowerCase()] = false;
    });

    // Ciclo continuo di guida con Joystick / Tastiera
    function joyUpdateLoop() {
      let vx = joyDeltaX;
      let vy = joyDeltaY;

      // Tastiera override
      if (keys['w'] || keys['arrowup']) vy = -1;
      if (keys['s'] || keys['arrowdown']) vy = 1;
      if (keys['a'] || keys['arrowleft']) vx = -1;
      if (keys['d'] || keys['arrowright']) vx = 1;

      if (Math.abs(vx) > 0.05 || Math.abs(vy) > 0.05) {
        // Sterzata
        userHeading += vx * 3.5;
        impostaHeading(userHeading);

        // Avanzamento vettura lungo la direzione dell'heading
        const speedKmh = Math.abs(vy) * 60; // 0-60 km/h
        const speedMetersPerFrame = (speedKmh / 3.6) * 0.016 * -Math.sign(vy);

        const rad = (userHeading * Math.PI) / 180;
        const deltaLat = (speedMetersPerFrame * Math.cos(rad)) / 111320;
        const deltaLon = (speedMetersPerFrame * Math.sin(rad)) / (111320 * Math.cos((userLocation.lat * Math.PI) / 180));

        userLocation.lat += deltaLat;
        userLocation.lon += deltaLon;

        userMarker.setLatLng([userLocation.lat, userLocation.lon]);

        if (isNavigating && activeRoute) {
          aggiornaNavigazioneConAutoZoom();
        } else {
          map.panTo([userLocation.lat, userLocation.lon]);
        }
      }

      if (isDraggingJoy || Object.values(keys).some(k => k)) {
        joyLoopId = requestAnimationFrame(joyUpdateLoop);
      } else {
        joyLoopId = null;
      }
    }

    function toggleJoystick() {
      const panel = document.getElementById('joystick-panel');
      const btn = document.getElementById('btn-toggle-joy');
      joystickActive = !joystickActive;
      panel.style.display = joystickActive ? 'flex' : 'none';
      btn.classList.toggle('active', joystickActive);
    }

    function toggleAudio() {
      voiceEnabled = !voiceEnabled;
      const icon = document.getElementById('audio-icon');
      icon.setAttribute('data-lucide', voiceEnabled ? 'volume-2' : 'volume-x');
      lucide.createIcons();
      showToast(voiceEnabled ? "Guida vocale attiva" : "Guida vocale disattivata");
    }

    function centraSuPosizione() {
      map.setView([userLocation.lat, userLocation.lon], 16, { animate: true });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }
  </script>
</body>
